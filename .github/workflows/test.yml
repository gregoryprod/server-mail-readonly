name: Read-only mail tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: gem install net-imap -v 0.6.8 --no-document
      - run: gem install minitest -v 5.25.5 --no-document
      - run: ruby -c read_mail.rb
      - run: ruby read_mail.rb --check
      - run: ruby test/read_mail_test.rb
      - name: PowerShell 5.1 instructions and paths with spaces
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Ruby = (& ruby -r rbconfig -e 'print RbConfig.ruby')
          $Gem = (& $Ruby -r rbconfig -e 'print File.join(RbConfig::CONFIG.fetch(%q{bindir}), %q{gem})')
          if (-not (Test-Path -LiteralPath $Gem)) { throw 'RubyGems path is invalid' }
          $Dir = Join-Path $env:RUNNER_TEMP 'Mail Setup Space'
          New-Item -ItemType Directory -Path $Dir -Force | Out-Null
          Copy-Item -LiteralPath .\read_mail.rb -Destination $Dir
          $Script = Join-Path $Dir 'read_mail.rb'
          $Config = Join-Path $Dir 'test config.json'
          & $Ruby $Script --config $Config --configure --host imap.example.test --user reader@example.test
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          $Result = & $Ruby $Script --config $Config --check
          if ($LASTEXITCODE -ne 0) { throw 'Check failed' }
          if (-not (($Result | ConvertFrom-Json).configured)) { throw 'Configuration was not loaded' }
